[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Report JSON is read at runtime to resolve the latest PDF per complex.
  included_files = ["src/content/reports/**"]

# Netlify Forms stores each lead; the submission-created function then fires
# automatically to send emails and server-side events.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/placeholders/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
